# =============================================================================
# Production / local stack — infra + API + Web (image build từ docker/Dockerfile).
#
# Chạy từ root repo:
#   docker compose -f docker/docker-compose.yml --env-file docker/.env.docker up --build
# Hoặc: pnpm docker:up
#
# Chỉ infra (Postgres, Redis): pnpm docker:infra:up
# Sau khi đổi NEXT_PUBLIC_*: build lại image (pnpm docker:rebuild).
# =============================================================================

name: costy

services:
  # ─── PostgreSQL + pgvector — Prisma, full-text / vector search ─────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: costy-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    # Chỉ bind localhost — không expose Postgres ra Internet trên VPS.
    # API trong stack vẫn kết nối qua hostname `postgres` (Docker network nội bộ).
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis — BullMQ queue, cache, rate-limit store ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: costy-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    # Chỉ bind localhost — không expose Redis ra Internet trên VPS.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── API — Express + BullMQ workers (cùng process, xem apps/server) ────────
  # Entrypoint: migrate DB rồi start server (docker/api-entrypoint.sh).
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://127.0.0.1:4000}
        NEXT_PUBLIC_DEMO_USER_ID: ${NEXT_PUBLIC_DEMO_USER_ID:-seed_demo_user_001}
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-/api}
    image: costy:local
    container_name: costy-api
    restart: unless-stopped
    command: ['/usr/local/bin/api-entrypoint.sh']
    ports:
      - '4000:4000'
    env_file:
      - .env.docker
    # File chat upload lưu local đĩa (apps/server/uploads); volume giữ qua rebuild/recreate.
    volumes:
      - costy-uploads:/app/apps/server/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Web — Next.js production server (cùng image, CMD khác api) ────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://127.0.0.1:4000}
        NEXT_PUBLIC_DEMO_USER_ID: ${NEXT_PUBLIC_DEMO_USER_ID:-seed_demo_user_001}
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-/api}
    image: costy:local
    container_name: costy-web
    restart: unless-stopped
    command: ['pnpm', '--filter', '@costy/web', 'start']
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    depends_on:
      api:
        condition: service_started

  # ─── Admin — Next.js dashboard quản trị (cùng image, port 3001) ────────────
  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://127.0.0.1:4000}
        NEXT_PUBLIC_DEMO_USER_ID: ${NEXT_PUBLIC_DEMO_USER_ID:-seed_demo_user_001}
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-/api}
    image: costy:local
    container_name: costy-admin
    restart: unless-stopped
    command: ['pnpm', '--filter', '@costy/admin', 'start']
    ports:
      - '3001:3001'
    env_file:
      - .env.docker
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  costy-uploads:
